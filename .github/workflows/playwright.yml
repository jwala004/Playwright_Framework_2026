name: Run Playwright Tests

on:
  # Daily PROD execution at 12:20 AM IST
  schedule:
    - cron: "20 0 * * *"
      timezone: "Asia/Kolkata"

  # Manual execution
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - QA
          - UAT
          - PROD

# Least privilege
permissions:
  contents: read

# Prevent overlapping executions for the same environment
concurrency:
  group: playwright-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'prod' || inputs.environment }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'schedule' && 'PROD' || inputs.environment }}
    env:
      TEST_ENV: ${{ github.event_name == 'schedule' && 'prod' || (inputs.environment == 'QA' && 'qa' || inputs.environment == 'UAT' && 'uat' || 'prod') }}

    steps:
      # -----------------------------------------
      # 1. Checkout
      # -----------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------
      # 2. Setup Node
      # -----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "npm"
      # -----------------------------------------
      # 3. Install dependencies
      # -----------------------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------------------
      # 4. Install Playwright browsers
      # -----------------------------------------
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # -----------------------------------------
      # 5. Validate environment configuration
      # -----------------------------------------
      - name: Validate test environment configuration on Github
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

        run: |
          echo "======================================"
          echo "Environment: $TEST_ENV"
          echo "======================================"

          if [ -n "$BASE_URL" ]; then
            echo "BASE_URL: available"
          else
            echo "BASE_URL: MISSING"
          fi

          if [ -n "$APP_USERNAME" ]; then
            echo "APP_USERNAME: available"
          else
            echo "APP_USERNAME: MISSING"
          fi

          if [ -n "$APP_PASSWORD" ]; then
            echo "APP_PASSWORD: available"
          else
            echo "APP_PASSWORD: MISSING"
          fi
      # this is added for debugging
      - name: Diagnose Playwright environment
        run: |
          echo "======================================"
          echo "GitHub Actions Runtime Diagnostics"
          echo "======================================"
          echo "Event: ${{ github.event_name }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "SHA: ${{ github.sha }}"
          echo "TEST_ENV: $TEST_ENV"
          echo "CI: $CI"
          echo "PWDEBUG: ${PWDEBUG:-not-set}"
          node --version
          npm --version
          npx playwright --version
          echo "======================================"
      # this is added for debugging ends here

      # -----------------------------------------
      # 6. Run Playwright tests
      # -----------------------------------------
      - name: Run Playwright tests
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

        run: npm test

      # -----------------------------------------
      # 7. Upload Playwright HTML report
      # -----------------------------------------
      - name: Upload Playwright HTML Report
        if: ${{ always() }} # Regardless of whether tests passed or failed or cancelled, upload the report

        uses: actions/upload-artifact@v4

        with:
          name: playwright-report-${{ env.TEST_ENV }}-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn
      # -----------------------------------------
      # 8. Upload test results
      # -----------------------------------------
      - name: Upload Test Results
        if: ${{ always() }}

        uses: actions/upload-artifact@v4

        with:
          name: playwright-test-results-${{ env.TEST_ENV }}-${{ github.run_number }}
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

       # Step 5 - Verify Allure Installation
      - name: Verify Allure Installation
        run: |
          echo "Allure CLI version:"
          npx allure --version
          echo ""
          echo "allure-playwright version:"
          npm list allure-playwright

      # Step 6 - Clean Previous Results
      - name: Clean Previous Results
        run: |
          rm -rf allure-results allure-report
          mkdir -p allure-results
          echo "✓ Cleaned and initialized directories"

      # Step 7 - Execute Playwright Tests with Detailed Logging
      - name: Run Playwright Tests
        run: |
          echo "Starting Playwright tests with env.TEST_ENV"
          npm run test:qa:parallel:headless || true
          echo "Test run completed (exit code: $?)"

      # Step 8 - Debug: Check Test Results
      - name: Debug - List Test Artifacts
        if: always()
        run: |
          echo "========== DEBUGGING INFO =========="
          echo ""
          echo "--- Current Directory Structure ---"
          ls -la
          echo ""
          echo "--- Allure Results Directory ---"
          if [ -d "allure-results" ]; then
            echo "✓ allure-results directory exists"
            echo "Total files: $(ls allure-results 2>/dev/null | wc -l)"
            echo "Files:"
            ls -lh allure-results | head -20
            echo ""
            echo "--- Sample Result File ---"
            if ls allure-results/*.json 1> /dev/null 2>&1; then
              FILE=$(ls allure-results/*.json | head -1)
              echo "First JSON file: $FILE"
              head -c 500 "$FILE"
              echo ""
            fi
          else
            echo "✗ allure-results directory does NOT exist!"
          fi
          echo ""
          echo "--- Test Results (Playwright) ---"
          if [ -d "test-results" ]; then
            ls -la test-results
          else
            echo "No test-results directory"
          fi
          echo "===== END DEBUG ====="

      # Step 9 - Verify Results Before Generating Report
      - name: Verify Allure Results Exist
        if: always()
        run: |
          if [ ! -d "allure-results" ]; then
            echo "ERROR: allure-results directory missing!"
            exit 1
          fi
          
          RESULT_COUNT=$(ls allure-results/*.json 2>/dev/null | wc -l)
          if [ "$RESULT_COUNT" -eq 0 ]; then
            echo "WARNING: allure-results directory is EMPTY!"
            echo "This means tests did not generate Allure results."
            echo ""
            echo "Checking playwright config..."
            grep -A 5 "reporter:" playwright.config.ts
          else
            echo "✓ Found $RESULT_COUNT result files"
          fi

      # Step 10 - Generate Allure Report
      - name: Generate Allure Report
        if: always()
        run: |
          echo "===== GENERATING ALLURE REPORT ====="
          npm run allure:generate
          EXIT_CODE=$?
          echo "Generation exit code: $EXIT_CODE"
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "ERROR: Allure generation failed!"
            exit 1
          fi
          
          echo "Report generated successfully"

      # Step 11 - Verify Report Structure
      - name: Verify Report Structure
        if: always()
        run: |
          echo "===== VERIFYING REPORT STRUCTURE ====="
          if [ -d "allure-report" ]; then
            echo "✓ allure-report directory exists"
            echo ""
            echo "Report contents:"
            ls -lh allure-report
            echo ""
            
            # Check critical files
            for FILE in index.html app.js widgets app data; do
              if [ -e "allure-report/$FILE" ]; then
                echo "✓ $FILE exists"
              else
                echo "✗ MISSING: $FILE"
              fi
            done
          else
            echo "✗ allure-report directory NOT created - report generation FAILED!"
            exit 1
          fi

      # Step 12 - Upload Allure Report
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: error
          retention-days: 30

      # Step 13 - Summary
      - name: Build Summary
        if: always()
        run: |
          echo "## Allure Report Generated ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the artifact from the **Artifacts** section" >> $GITHUB_STEP_SUMMARY

