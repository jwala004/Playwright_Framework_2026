name: Playwright Tests

on:

  schedule:
    - cron: '30 20 * * *'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment'
        required: true
        type: choice
        options:
          - QA
          - UAT
          - PROD

jobs:

  test:

    timeout-minutes: 60

    runs-on: ubuntu-latest

    environment:
      name: ${{ github.event_name == 'schedule' && 'PROD' || inputs.environment }}

    env:
      TEST_ENV: ${{ github.event_name == 'schedule' && 'prod' || (inputs.environment == 'QA' && 'qa' || inputs.environment == 'UAT' && 'uat' || 'prod') }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Verify GitHub Environment
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          echo "======================================"
          echo "Environment: $TEST_ENV"
          echo "======================================"

          if [ -n "$BASE_URL" ]; then
            echo "BASE_URL: available"
          else
            echo "BASE_URL: MISSING"
          fi

          if [ -n "$APP_USERNAME" ]; then
            echo "APP_USERNAME: available"
          else
            echo "APP_USERNAME: MISSING"
          fi

          if [ -n "$APP_PASSWORD" ]; then
            echo "APP_PASSWORD: available"
          else
            echo "APP_PASSWORD: MISSING"
          fi

      - name: Run Playwright tests
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: npm test

      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ env.TEST_ENV }}
          path: playwright-report/
          retention-days: 30