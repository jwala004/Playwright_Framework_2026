name: Run Playwright Tests

on:
  # Daily PROD execution at 12:20 AM IST
  schedule:
    - cron: "20 0 * * *"
      timezone: "Asia/Kolkata"

  # Manual execution
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        type: choice
        options:
          - QA
          - UAT
          - PROD

# Least privilege
permissions:
  contents: read

# Prevent overlapping executions for the same environment
concurrency:
  group: playwright-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'prod' || inputs.environment }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.event_name == 'schedule' && 'PROD' || inputs.environment }}

    env:
      TEST_ENV: ${{ github.event_name == 'schedule' && 'prod' || (inputs.environment == 'QA' && 'qa' || inputs.environment == 'UAT' && 'uat' || 'prod') }}

    steps:

      # -----------------------------------------
      # 1. Checkout
      # -----------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------
      # 2. Setup Node.js
      # -----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "npm"

      # -----------------------------------------
      # 3. Install dependencies
      # -----------------------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------------------
      # 4. Install Playwright browsers
      # -----------------------------------------
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # -----------------------------------------
      # 5. Validate environment configuration
      # -----------------------------------------
      - name: Validate test environment configuration
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

        run: |
          echo "======================================"
          echo "Environment: $TEST_ENV"
          echo "======================================"

          if [ -n "$BASE_URL" ]; then
            echo "BASE_URL: available"
          else
            echo "BASE_URL: MISSING"
          fi

          if [ -n "$APP_USERNAME" ]; then
            echo "APP_USERNAME: available"
          else
            echo "APP_USERNAME: MISSING"
          fi

          if [ -n "$APP_PASSWORD" ]; then
            echo "APP_PASSWORD: available"
          else
            echo "APP_PASSWORD: MISSING"
          fi

      # -----------------------------------------
      # 6. Runtime diagnostics
      # -----------------------------------------
      - name: Diagnose Playwright environment
        run: |
          echo "======================================"
          echo "GitHub Actions Runtime Diagnostics"
          echo "======================================"
          echo "Event: ${{ github.event_name }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "SHA: ${{ github.sha }}"
          echo "TEST_ENV: $TEST_ENV"
          echo "CI: $CI"
          node --version
          npm --version
          npx playwright --version
          npx allure --version
          echo "======================================"

      # -----------------------------------------
      # 7. Run Playwright tests
      # -----------------------------------------
      - name: Run Playwright tests
        id: playwright-tests
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}

        run: |
          echo "Starting Playwright tests..."
          echo "TEST_ENV=$TEST_ENV"

          npm run test

      # -----------------------------------------
      # 8. Inspect Allure results
      # -----------------------------------------
      - name: Check Allure results
        if: ${{ always() }}
        run: |
          echo "======================================"
          echo "Allure Results"
          echo "======================================"

          if [ -d "allure-results" ]; then
            echo "✓ allure-results directory exists"
            echo "Result files: $(find allure-results -type f | wc -l)"
            ls -lah allure-results
          else
            echo "✗ allure-results directory does NOT exist"
            exit 1
          fi

      # -----------------------------------------
      # 9. Generate Allure report
      # -----------------------------------------
      - name: Generate Allure report
        if: ${{ always() }}
        run: |
          echo "======================================"
          echo "Generating Allure Report"
          echo "======================================"

          npm run allure:generate

      # -----------------------------------------
      # 10. Verify Allure report
      # -----------------------------------------
      - name: Verify Allure report
        if: ${{ always() }}
        run: |
          echo "======================================"
          echo "Verifying Allure Report"
          echo "======================================"

          if [ -d "allure-report" ]; then
            echo "✓ allure-report directory exists"
            echo "Report files: $(find allure-report -type f | wc -l)"
          else
            echo "✗ allure-report directory does NOT exist"
            exit 1
          fi

      # -----------------------------------------
      # 11. Upload Playwright HTML report
      # -----------------------------------------
      - name: Upload Playwright HTML Report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ env.TEST_ENV }}-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: warn

      # -----------------------------------------
      # 12. Upload Playwright test results
      # -----------------------------------------
      - name: Upload Playwright test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ env.TEST_ENV }}-${{ github.run_number }}
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

      # -----------------------------------------
      # 13. Upload Allure report
      # -----------------------------------------
      - name: Upload Allure report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ env.TEST_ENV }}-${{ github.run_number }}
          path: allure-report/
          retention-days: 30
          if-no-files-found: error

      # -----------------------------------------
      # 14. GitHub Actions summary
      # -----------------------------------------
      - name: Build Summary
        if: ${{ always() }}
        run: |
          echo "## Allure Report Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Environment: **$TEST_ENV**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the Allure report from the **Artifacts** section." >> $GITHUB_STEP_SUMMARY

